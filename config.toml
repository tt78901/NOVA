# Nova — configuration. Every key here is optional; delete a line to fall back
# to the default in assistant/config.py.

name = "Nova"

# AppleScript is a full scripting escape hatch: it lets Nova automate anything
# on the Mac, but also lets the model run arbitrary code. Opt in knowingly.
allow_applescript = false

[wake]
# "whisper"      — works with any wake phrase, including "hey nova". Costs
#                  nothing while the room is quiet; transcribes only speech.
# "openwakeword" — near-zero CPU always-on model, but it only knows the
#                  phrases it ships: alexa, hey_mycroft, hey_jarvis,
#                  hey_rhasspy. Set `model` below to one of those.
backend = "whisper"
phrase = "hey nova"
model = "hey_jarvis"
threshold = 0.5
# Seconds to keep listening after answering, so follow-ups don't need the
# wake word. Set to 0 to require it every time.
follow_up_seconds = 8.0

[ui]
# The HUD: a local page showing state, live mic level and the transcript.
# Served on localhost only, over server-sent events.
enabled = true
port = 7788
open_browser = true

[audio]
input_device = ""       # empty = system default; see `nova --devices`
samplerate = 16000
frame_ms = 80
silence_ms = 900        # trailing silence that ends your turn
max_utterance_ms = 15000
min_utterance_ms = 400

[stt]
# Downloaded from Hugging Face on first run (~1.5 GB), then cached locally.
# Swap for "mlx-community/whisper-small.en-mlx" if you want it lighter.
model = "mlx-community/whisper-large-v3-turbo"
language = "en"
# Prime Whisper with the wake word, command grammar and the names of your
# installed apps, so "open Xcode" stops coming back as "open exit code".
bias = true

[llm]
host = "http://127.0.0.1:11434"
model = "qwen3:8b"
temperature = 0.6
context_tokens = 8192
max_history_turns = 8
think = false           # qwen3 reasoning; off keeps replies fast
max_tool_iterations = 5

[tts]
enabled = true
# "kokoro" — an 82M neural model on the GPU. Natural, and about thirty times
#            faster than real time, so streaming stays instant.
# "say"    — macOS built-in. No download, but an older generation of synthesis.
backend = "kokoro"

# Kokoro voices. First letter is accent (a = American, b = British),
# second is gender.
#   American female  af_heart af_nova af_bella af_sarah af_sky af_aoede af_kore
#   American male    am_michael am_puck am_adam am_echo am_eric am_liam am_onyx
#   British female   bf_emma bf_alice bf_isabella bf_lily
#   British male     bm_george bm_fable bm_daniel bm_lewis
voice = "af_heart"
model = "mlx-community/Kokoro-82M-bf16"
speed = 1.0             # 1.0 is natural; 1.15 is brisker

# Used only when backend = "say".
rate = 190              # words per minute
